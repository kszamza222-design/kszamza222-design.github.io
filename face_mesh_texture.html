<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindAR Face Texture</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    #status {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 8px 14px;
      color: white;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 20px;
      font: 14px sans-serif;
    }
  </style>
</head>

<body>
  <div id="container"></div>
  <div id="status">กำลังเปิดกล้อง...</div>

  <script type="module">
    import * as THREE from 'three';
    import {MindARThree} from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js';

    const container = document.querySelector('#container');
    const status = document.querySelector('#status');

    const start = async () => {
      try {
        const mindarThree = new MindARThree({container});
        const {renderer, scene, camera} = mindarThree;

        renderer.setClearColor(0x000000, 0);

        const faceMesh = mindarThree.addFaceMesh();
        const texture = new THREE.TextureLoader().load(
          './memeface.png',
          () => { status.textContent = 'หันกล้องเข้าหาใบหน้า'; },
          undefined,
          () => { status.textContent = 'โหลด memeface.png ไม่ได้'; }
        );

        texture.colorSpace = THREE.SRGBColorSpace;
        faceMesh.material.dispose();
        faceMesh.material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          opacity: 1,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        faceMesh.material.needsUpdate = true;
        scene.add(faceMesh);

        await mindarThree.start();
        status.textContent = 'กำลังตรวจจับใบหน้า...';

        renderer.setAnimationLoop(() => {
          if (mindarThree.getLatestEstimate()) {
            status.textContent = 'ตรวจพบใบหน้าแล้ว';
          } else {
            status.textContent = 'หันใบหน้าเข้าหากล้อง';
          }
          renderer.render(scene, camera);
        });
      } catch (error) {
        console.error(error);
        status.textContent = 'เปิด Face Tracking ไม่ได้';
      }
    };

    start();
  </script>
</body>
</html>
