<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090817">
  <title>Neon Cyber Face Blendshape</title>

  <!-- Import maps: Three.js + MindAR -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090817;
      color: #f5f4ff;
      font-family: Arial, Tahoma, sans-serif;
    }

    #container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, #24204e 0%, #100d25 48%, #070711 100%);
    }

    #container video,
    #container canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    #ui {
      position: fixed;
      z-index: 20;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 460px);
      padding: 15px 16px;
      border: 1px solid rgba(0, 245, 255, .45);
      border-radius: 16px;
      background: rgba(9, 8, 30, .86);
      box-shadow: 0 0 26px rgba(0, 245, 255, .13);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    h1 {
      margin: 0 0 7px;
      color: #55fbff;
      font-size: clamp(17px, 4vw, 22px);
      letter-spacing: 2px;
    }

    #status {
      margin: 8px 0 12px;
      color: #dedcff;
      font-size: 13px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 9px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    #startButton {
      color: #07121e;
      background: #00f5ff;
      box-shadow: 0 0 16px rgba(0, 245, 255, .22);
    }

    #stopButton {
      color: white;
      background: #383353;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #hint {
      position: fixed;
      z-index: 15;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: 92vw;
      color: #e0ddff;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
      text-shadow: 0 1px 5px #000;
      pointer-events: none;
    }

    #debug {
      display: none;
      max-height: 100px;
      overflow: auto;
      margin-top: 8px;
      color: #a5ffcf;
      font-size: 10px;
      text-align: left;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="container"></div>

  <section id="ui">
    <h1>NEON CYBER FACE</h1>
    <div id="status">กำลังเตรียมโมเดล กรุณารอสักครู่...</div>
    <div class="button-row">
      <button id="startButton" disabled>Start Camera</button>
      <button id="stopButton" disabled>Stop Camera</button>
    </div>
    <div id="debug"></div>
  </section>

  <div id="hint">
    อนุญาตการใช้กล้อง แล้วหันหน้าเข้าหากล้อง ลองกะพริบตา ยิ้ม และอ้าปาก
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { MindARThree } from 'mindar-face-three';

    // =====================================================
    // SETTINGS
    // =====================================================

    // ต้องวาง my_face.glb ไว้ในโฟลเดอร์เดียวกับ index.html
    const MODEL_URL = './my_face.glb';

    // โมเดลที่สร้างจากสคริปต์ Blender ก่อนหน้า
    // ปรับค่านี้ได้หากโมเดลใหญ่/เล็กเกินไป
    const MODEL_SCALE = 1.2;
    const MODEL_POSITION = { x: 0, y: 0, z: 0 };

    // ถ้าต้องการตรวจสอบชื่อ Morph Targets ให้เปิดเป็น true
    const SHOW_DEBUG = true;

    // =====================================================
    // DOM
    // =====================================================

    const container = document.querySelector('#container');
    const statusText = document.querySelector('#status');
    const startButton = document.querySelector('#startButton');
    const stopButton = document.querySelector('#stopButton');
    const debugPanel = document.querySelector('#debug');

    debugPanel.style.display = SHOW_DEBUG ? 'block' : 'none';

    function setStatus(message) {
      statusText.textContent = message;
    }

    function showDebug(message) {
      if (SHOW_DEBUG) debugPanel.textContent = message;
    }

    // =====================================================
    // THREE.JS + MINDAR
    // =====================================================

    const mindar = new MindARThree({
      container,
      uiLoading: 'no',
      uiScanning: 'no',
      uiError: 'no'
    });

    const { renderer, scene, camera } = mindar;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    // Environment reflections
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const roomEnvironment = new RoomEnvironment();
    const environmentTarget = pmremGenerator.fromScene(roomEnvironment);
    scene.environment = environmentTarget.texture;
    roomEnvironment.dispose();
    pmremGenerator.dispose();

    // Studio lighting
    scene.add(new THREE.HemisphereLight(0xe6e2ff, 0x19102e, 1.5));

    const cyanLight = new THREE.PointLight(0x00f5ff, 2.0, 5);
    cyanLight.position.set(1, 1, 2);
    scene.add(cyanLight);

    const purpleLight = new THREE.PointLight(0x8b35ff, 1.8, 5);
    purpleLight.position.set(-1, 0.5, 1);
    scene.add(purpleLight);

    // Keep the same anchor approach as the supplied example.
    const anchor = mindar.addAnchor(1);

    // =====================================================
    // LOAD GLB
    // =====================================================

    let modelRoot = null;
    const morphMeshes = [];

    async function loadFaceModel() {
      setStatus('กำลังโหลด my_face.glb ...');

      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync(MODEL_URL);
      modelRoot = gltf.scene;

      modelRoot.scale.setScalar(MODEL_SCALE);
      modelRoot.position.set(
        MODEL_POSITION.x,
        MODEL_POSITION.y,
        MODEL_POSITION.z
      );

      modelRoot.traverse((object) => {
        if (!object.isMesh) return;

        // Keep the materials exported from Blender so the custom
        // purple/cyan/green colors are preserved.
        if (object.material) {
          const materials = Array.isArray(object.material)
            ? object.material
            : [object.material];

          for (const material of materials) {
            if (material) {
              material.needsUpdate = true;
              if ('emissiveIntensity' in material &&
                  material.emissive &&
                  material.emissive.getHex() !== 0) {
                material.emissiveIntensity = Math.max(
                  material.emissiveIntensity,
                  0.5
                );
              }
            }
          }
        }

        if (
          object.morphTargetDictionary &&
          object.morphTargetInfluences
        ) {
          morphMeshes.push(object);
        }
      });

      if (morphMeshes.length === 0) {
        throw new Error(
          'ไม่พบ Morph Targets ใน my_face.glb กรุณาตรวจสอบ Shape Keys และการ Export จาก Blender'
        );
      }

      anchor.group.add(modelRoot);

      const lines = [];
      for (const mesh of morphMeshes) {
        const names = Object.keys(mesh.morphTargetDictionary);
        lines.push(`${mesh.name}: ${names.join(', ')}`);
      }

      console.log('GLB loaded:', gltf);
      console.log('Morph Targets by mesh:\n' + lines.join('\n'));
      showDebug(lines.join('\n'));

      setStatus('โหลดโมเดลสำเร็จ กด Start Camera เพื่อเริ่ม');
      startButton.disabled = false;
    }

    // =====================================================
    // BLENDSHAPE MAPPING
    // =====================================================

    // MindAR returns category names such as eyeBlinkLeft and jawOpen.
    // Only names that exist in the GLB are applied.
    function updateBlendshapes(blendshapes) {
      if (!blendshapes) return;

      const categories = blendshapes.categories ?? [];
      const scores = new Map();

      for (const category of categories) {
        scores.set(category.categoryName, category.score);
      }

      for (const mesh of morphMeshes) {
        const dictionary = mesh.morphTargetDictionary;
        const influences = mesh.morphTargetInfluences;

        for (const [targetName, index] of Object.entries(dictionary)) {
          if (scores.has(targetName)) {
            influences[index] = THREE.MathUtils.clamp(
              scores.get(targetName),
              0,
              1
            );
          }
        }

        // Compatibility helpers for this starter model:
        // MindAR exposes left/right smile scores, while the mouth mesh
        // created by the generator has a single "mouthSmile" target.
        if (dictionary.mouthSmile !== undefined) {
          const left = scores.get('mouthSmileLeft') ?? 0;
          const right = scores.get('mouthSmileRight') ?? 0;
          influences[dictionary.mouthSmile] = Math.max(left, right);
        }
      }
    }

    // =====================================================
    // CAMERA START / STOP
    // =====================================================

    let isRunning = false;
    let isStarting = false;

    async function startCamera() {
      if (isRunning || isStarting) return;

      isStarting = true;
      startButton.disabled = true;

      try {
        if (!modelRoot) {
          await loadFaceModel();
        }

        setStatus('กำลังเปิดกล้อง กรุณากดอนุญาต Camera');

        await mindar.start();
        isRunning = true;

        stopButton.disabled = false;
        setStatus('กล้องทำงานแล้ว ลองขยับใบหน้า');

        renderer.setAnimationLoop(() => {
          const estimate = mindar.getLatestEstimate();

          if (estimate && estimate.blendshapes) {
            updateBlendshapes(estimate.blendshapes);
          }

          renderer.render(scene, camera);
        });
      } catch (error) {
        console.error('Start camera error:', error);
        setStatus(
          'เริ่มระบบไม่สำเร็จ: ' +
          (error?.message || 'ตรวจสอบสิทธิ์กล้องและไฟล์โมเดล')
        );
        startButton.disabled = false;
        stopButton.disabled = true;
      } finally {
        isStarting = false;
      }
    }

    function stopCamera() {
      if (!isRunning) return;

      renderer.setAnimationLoop(null);
      mindar.stop();

      isRunning = false;
      startButton.disabled = false;
      stopButton.disabled = true;
      setStatus('หยุดกล้องแล้ว กด Start Camera เพื่อเริ่มใหม่');
    }

    startButton.addEventListener('click', startCamera);
    stopButton.addEventListener('click', stopCamera);

    // =====================================================
    // RESIZE
    // =====================================================

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =====================================================
    // INITIALIZE MODEL
    // =====================================================

    loadFaceModel().catch((error) => {
      console.error('GLB loading error:', error);
      setStatus(
        'โหลดโมเดลไม่สำเร็จ: ตรวจสอบว่า my_face.glb อยู่ข้าง index.html'
      );
      startButton.disabled = true;
    });
  </script>
</body>
</html>
