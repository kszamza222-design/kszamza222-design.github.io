<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>MindAR — จิรเมธ สายะนันท์ (โอเล่)</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <link rel="stylesheet" href="./ar.css?v=20261023-2">
  <script src="./ar.js?v=20261023-2"></script>
</head>
<body>
  <div class="name-card">
    <strong>จิรเมธ สายะนันท์ (โอเล่)</strong>
    <p id="status" role="status" aria-live="polite">MindAR — สแกนภาพเดิมเพื่อดูโมเดล 3D พร้อมแอนิเมชัน</p>
    <button id="retry" hidden>ลองอีกครั้ง</button>
  </div>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 3; uiScanning: no;" renderer="colorManagement: true; antialias: true; precision: medium;" vr-mode-ui="enabled: false" xr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" loading-screen="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
    <a-entity light="type: hemisphere; color: #ffffff; groundColor: #a7b5cc; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; color: #fff3df; intensity: 1.5" position="1 2 3"></a-entity>
    <a-entity light="type: directional; color: #c2dcff; intensity: 0.5" position="-2 1 0"></a-entity>
    <a-entity mindar-image-target="targetIndex: 0" character="name: กระต่าย; src: ./rabbit.glb; size: 0.85"></a-entity>
    <a-entity mindar-image-target="targetIndex: 1" character="name: มังกร; src: ./dragon.glb; size: 1.05"></a-entity>
    <a-entity mindar-image-target="targetIndex: 2" character="name: Angel / Devil; src: ./angel-devil.glb; size: 1.2"></a-entity>
  </a-scene>
</body>
</html>
