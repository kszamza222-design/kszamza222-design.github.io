<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>MindAR — จิรเมธ สายะนันท์ (โอเล่)</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#101820; font-family:system-ui,sans-serif; }
    .panel { position:fixed; z-index:10; top:calc(12px + env(safe-area-inset-top)); left:12px; right:12px; max-width:420px; margin:0 auto; padding:16px; color:#fff; background:rgba(16,24,32,.88); border:1px solid rgba(255,255,255,.18); border-radius:16px; backdrop-filter:blur(8px); }
    .panel h1 { margin:0 0 6px; font-size:20px; }
    .owner { margin:0 0 12px; color:#cbd5e1; font-size:14px; line-height:1.5; }
    .status-row { display:flex; align-items:flex-start; gap:8px; }
    .dot { flex-shrink:0; width:10px; height:10px; margin-top:6px; border-radius:50%; background:#fbbf24; }
    .panel[data-state="ready"] .dot { background:#38bdf8; }
    .panel[data-state="found"] .dot { background:#4ade80; }
    .panel[data-state="error"] .dot { background:#fb7185; }
    #status { margin:0; font-size:14px; line-height:1.6; }
    .help { margin:10px 0 0; color:#cbd5e1; font-size:13px; line-height:1.6; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .actions a, .actions button { display:inline-block; padding:9px 12px; color:#fff; background:#263746; border:1px solid rgba(255,255,255,.18); border-radius:8px; font:inherit; font-size:13px; text-decoration:none; cursor:pointer; }
    .actions a:hover, .actions button:hover { background:#344b60; }
    .actions a:focus-visible, .actions button:focus-visible { outline:2px solid #38bdf8; outline-offset:3px; }
    [hidden] { display:none !important; }
    .bottom-hint { position:fixed; z-index:10; bottom:calc(16px + env(safe-area-inset-bottom)); left:16px; right:16px; margin:0; padding:10px 14px; color:#fff; background:rgba(16,24,32,.78); border-radius:12px; text-align:center; font-size:13px; line-height:1.6; pointer-events:none; }
    @media(max-height:500px) { .owner,.help,.bottom-hint { display:none; } .panel { margin-left:0; max-width:330px; padding:12px; } }
  </style>
</head>
<body>
  <header id="panel" class="panel" data-state="loading">
    <h1>MindAR — Image Tracking</h1>
    <p class="owner">จิรเมธ สายะนันท์ (โอเล่)</p>
    <div class="status-row">
      <span class="dot" aria-hidden="true"></span>
      <p id="status" role="status" aria-live="polite">กำลังเตรียมระบบ กรุณาอนุญาตให้ใช้กล้อง</p>
    </div>
    <p class="help">ใช้กล้องส่องภาพ Marker ที่แปลงเป็น targets.mind เมื่อพบภาพ จะเห็นกล่องสีฟ้าหมุนอยู่บนภาพ</p>
    <div class="actions">
      <a href="./target.jpg" target="_blank" rel="noopener noreferrer">ดูภาพ Marker</a>
      <button id="retry" type="button" hidden>โหลดใหม่</button>
    </div>
  </header>
  <p class="bottom-hint">เปิดภาพ Marker บนอีกหน้าจอหรือพิมพ์ลงกระดาษ แล้วส่องให้เห็นภาพครบ</p>

  <!-- วาง targets.mind และ target.jpg ในโฟลเดอร์เดียวกับ index.html -->
  <a-scene id="ar-scene"
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: yes; uiScanning: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="image-target" mindar-image-target="targetIndex: 0">
      <a-plane position="0 0 0.005" width="0.7" height="0.7"
        material="shader: flat; color: #0EA5E9; opacity: 0.2; transparent: true; side: double;"></a-plane>
      <a-box position="0 0 0.18" width="0.3" height="0.3" depth="0.3"
        material="shader: flat; color: #38BDF8;"
        animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 5000; easing: linear; loop: true;"></a-box>
      <a-sphere position="0.28 0 0.12" radius="0.065"
        material="shader: flat; color: #FBBF24;"
        animation="property: position; from: 0.28 -0.08 0.12; to: 0.28 0.08 0.12; dur: 1400; easing: easeInOutSine; dir: alternate; loop: true;"></a-sphere>
    </a-entity>
  </a-scene>
  <script>
    const panel = document.getElementById('panel');
    const statusText = document.getElementById('status');
    const retryButton = document.getElementById('retry');
    const scene = document.getElementById('ar-scene');
    const target = document.getElementById('image-target');
    function setStatus(state, message) {
      panel.dataset.state = state;
      statusText.textContent = message;
      retryButton.hidden = state !== 'error';
    }
    retryButton.addEventListener('click', () => window.location.reload());
    if (!window.AFRAME || !window.AFRAME.components['mindar-image']) {
      setStatus('error', 'โหลดระบบ AR ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วกดโหลดใหม่');
    } else if (!window.isSecureContext) {
      setStatus('error', 'กรุณาเปิดงานผ่าน URL แบบ HTTPS เช่น GitHub Pages');
    } else {
      scene.addEventListener('arReady', () => {
        setStatus('ready', 'กล้องพร้อมแล้ว — ส่องภาพ Marker เพื่อแสดงวัตถุ AR');
      });
      scene.addEventListener('arError', (event) => {
        setStatus('error', 'เริ่มระบบ AR ไม่สำเร็จ ตรวจสอบสิทธิ์กล้อง อินเทอร์เน็ต และไฟล์ targets.mind');
        console.error('MindAR error:', event.detail);
      });
      target.addEventListener('targetFound', () => {
        setStatus('found', 'พบภาพแล้ว — ลองขยับกล้องช้า ๆ เพื่อดูวัตถุตามภาพ');
      });
      target.addEventListener('targetLost', () => {
        setStatus('ready', 'ภาพหลุดจากกล้อง — ส่องภาพ Marker อีกครั้ง');
      });
    }
  </script>
</body>
</html>
