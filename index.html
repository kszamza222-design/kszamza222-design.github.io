<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demon Mark - MindAR Face Texture</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080608;
      font-family: Arial, sans-serif;
    }

    #container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #container video,
    #container canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #status {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 9999;
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 10px 16px;
      color: #fff;
      background: rgba(15, 5, 8, 0.8);
      border: 1px solid rgba(255, 45, 60, 0.65);
      border-radius: 24px;
      font-size: 14px;
      text-align: center;
      box-shadow: 0 0 18px rgba(255, 0, 30, 0.18);
    }

    #title {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      color: #ff3548;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 0 0 12px rgba(255, 0, 30, 0.8);
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="container"></div>
  <div id="title">DEMON MARK</div>
  <div id="status">กำลังเตรียมเปิดกล้อง...</div>

  <script type="module">
    import * as THREE from 'three';
    import {
      MindARThree
    } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js';

    const container = document.querySelector('#container');
    const status = document.querySelector('#status');

    let mindarThree = null;
    let faceMesh = null;
    let texture = null;
    let isRunning = false;

    async function start() {
      try {
        status.textContent = 'กำลังโหลด Face Texture...';

        mindarThree = new MindARThree({
          container: container
        });

        const {
          renderer,
          scene,
          camera
        } = mindarThree;

        renderer.setPixelRatio(
          Math.min(window.devicePixelRatio, 2)
        );

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.setClearColor(0x000000, 0);

        // สร้าง Face Mesh ของ MindAR
        faceMesh = mindarThree.addFaceMesh();

        // โหลด Demon Mark Texture
        const textureLoader = new THREE.TextureLoader();

        texture = await textureLoader.loadAsync(
          './demon-texture.png'
        );

        texture.colorSpace = THREE.SRGBColorSpace;

        // ตั้งค่า Texture
        texture.wrapS = THREE.ClampToEdgeWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;
        texture.needsUpdate = true;

        // ตั้งค่าวัสดุบนใบหน้า
        faceMesh.material.dispose();

        faceMesh.material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          opacity: 1,
          side: THREE.DoubleSide,
          depthWrite: false,
          toneMapped: false
        });

        faceMesh.material.needsUpdate = true;

        scene.add(faceMesh);

        status.textContent = 'กำลังเปิดกล้อง...';

        // เริ่มระบบตรวจจับใบหน้า
        await mindarThree.start();

        isRunning = true;

        status.textContent = 'หันใบหน้าเข้าหากล้อง';

        // วาดภาพทุกเฟรม
        renderer.setAnimationLoop(() => {
          if (!isRunning) return;

          const estimate = mindarThree.getLatestEstimate();

          if (estimate) {
            status.textContent = 'DEMON MARK: ตรวจพบใบหน้า';
          } else {
            status.textContent = 'หันใบหน้าเข้าหากล้อง';
          }

          renderer.render(scene, camera);
        });

      } catch (error) {
        console.error('MindAR error:', error);

        status.textContent =
          'เปิดกล้องหรือโหลด Texture ไม่สำเร็จ';

        console.error(
          'ตรวจสอบชื่อไฟล์ demon-texture.png และสิทธิ์กล้อง'
        );
      }
    }

    // ปรับขนาดเมื่อหน้าต่างเปลี่ยนขนาด
    window.addEventListener('resize', () => {
      if (!mindarThree) return;

      const { renderer } = mindarThree;

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );
    });

    // เริ่มทำงาน
    start();
  </script>
</body>
</html>
