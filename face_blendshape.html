<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NeoBot Face Tracking</title>
  <script type="importmap">
    {"imports":{
      "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }}
  </script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    /* Let MindAR own the camera crop, mirror transform, and canvas sizing. Overriding these breaks alignment. */
    #container{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:transparent;z-index:1}
    #container video{position:absolute!important;display:block!important;opacity:1!important;z-index:0!important;pointer-events:none!important;background:transparent!important}
    #container canvas{position:absolute!important;z-index:1!important;background:transparent!important;pointer-events:none!important}
    #start{position:absolute;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);border:0;border-radius:999px;padding:14px 22px;background:#f11d91;color:#fff;font-size:16px;font-weight:750;cursor:pointer;box-shadow:0 8px 30px #0005}
    #start[hidden]{display:none}
    #status{position:absolute;z-index:6;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:10px 12px;border-radius:12px;color:#fff;background:rgba(10,18,32,.76);border:1px solid rgba(255,255,255,.18);font-size:13px;text-align:center;pointer-events:none}
  </style>
</head>
<body>
  <div id="container">
    <button id="start">เริ่มใช้งานกล้อง</button>
    <div id="status">กดเริ่มใช้งานกล้อง แล้วอนุญาตให้เว็บใช้กล้อง</div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    import {MindARThree} from 'mindar-face-three';

    const container=document.querySelector('#container');
    const startButton=document.querySelector('#start');
    const statusBox=document.querySelector('#status');
    let mindar=null, raf=0, started=false, model=null, renderer=null;
    const trackedMeshes=[];
    const smooth=Object.create(null);
    const baseState=new WeakMap();
    const baseVertices=new WeakMap();
    let lastFrameTime=0;
    const clamp=(v,min=0,max=1)=>Math.max(min,Math.min(max,Number.isFinite(v)?v:0));
    const lerp=(a,b,t)=>a+(b-a)*t;
    const score=(scores,name)=>scores[name]||0;
    const status=message=>statusBox.textContent=message;

    function cacheBase(object){
      if(!object||baseState.has(object))return;
      baseState.set(object,{position:object.position.clone(),scale:object.scale.clone(),rotation:object.rotation.clone()});
    }
    function part(name){
      const object=model?.getObjectByName(name)||null;
      if(object)cacheBase(object);
      return object;
    }
    function base(object){return baseState.get(object)}

    function updateFace(raw, dt=1/60){
      // Time-based exponential smoothing: stable across 30/60/120Hz screens without adding much lag.
      const alpha=1-Math.exp(-Math.min(Math.max(dt,1/120),1/20)/0.075);
      for(const key of new Set([...Object.keys(smooth),...Object.keys(raw)]))
        smooth[key]=lerp(smooth[key]||0,raw[key]||0,alpha);
      const s=smooth;
      // Combine mouth-corner and brow signals so a visible frown still works when one tracker
      // coefficient is weak on a particular camera. This drives one coherent, eased emotion.
      const mouthFrown=clamp((score(s,'mouthFrownLeft')+score(s,'mouthFrownRight'))*.5);
      const browFrown=clamp((score(s,'browDownLeft')+score(s,'browDownRight'))*.5);
      const eyeSquint=clamp((score(s,'eyeSquintLeft')+score(s,'eyeSquintRight'))*.5);
      const noseSneer=clamp((score(s,'noseSneerLeft')+score(s,'noseSneerRight'))*.5);
      const anger=clamp(Math.max(mouthFrown,browFrown*.86,eyeSquint*.42,noseSneer*.36));

      // A coherent frown: brows lower and draw inward, with a slightly stronger inner-brow slant.
      for(const [name,outerName,downName,dir] of [
        ['Brow_Left','browOuterUpLeft','browDownLeft',-1],
        ['Brow_Right','browOuterUpRight','browDownRight',1]
      ]){
        const brow=part(name); if(!brow)continue;
        const b=base(brow);
        const inner=score(s,'browInnerUp');
        const down=clamp(Math.max(score(s,downName),browFrown*.70));
        const lift=clamp(inner*.48+score(s,outerName)*.90-down*.65-anger*.22,-.8,1);
        brow.position.y=b.position.y+lift*.105-down*.032-anger*.012;
        // The opposite signs make the inner ends tilt down toward the bridge of the nose.
        brow.rotation.z=b.rotation.z+dir*(lift*.075+down*.095+anger*.035);
      }

      // Ears/temples follow the main head pose and make a very subtle change for each expression.
      const earSmile=clamp((score(s,'mouthSmileLeft')+score(s,'mouthSmileRight'))*.5);
      const earPout=clamp(Math.max(score(s,'mouthPucker')*.98,score(s,'mouthFunnel')*.78));
      for(const [name,dir] of [['Temple_Left',-1],['Temple_Right',1]]){
        const ear=part(name); if(!ear)continue;
        const b=base(ear);
        ear.rotation.z=b.rotation.z+dir*(earSmile*.025-earPout*.012+anger*.012);
        ear.scale.y=b.scale.y*(1+earSmile*.025-anger*.012);
      }

      // Eye gaze, blinking, squinting and widening. Eyelids move as well as the pupils.
      for(const side of ['Left','Right']){
        const isLeft=side==='Left';
        const up=score(s,isLeft?'eyeLookUpLeft':'eyeLookUpRight');
        const down=score(s,isLeft?'eyeLookDownLeft':'eyeLookDownRight');
        const inward=score(s,isLeft?'eyeLookInLeft':'eyeLookInRight');
        const outward=score(s,isLeft?'eyeLookOutLeft':'eyeLookOutRight');
        const dx=isLeft?(inward-outward):(outward-inward);
        const dy=up-down;
        const blink=clamp(score(s,isLeft?'eyeBlinkLeft':'eyeBlinkRight'));
        const squint=clamp(score(s,isLeft?'eyeSquintLeft':'eyeSquintRight')+anger*.26);
        const wide=clamp(score(s,isLeft?'eyeWideLeft':'eyeWideRight')-anger*.18);

        const pupil=part('Pupil_'+side);
        const glint=part('Eye_Glint_'+side);
        const panel=part('EyePanel_'+side);
        for(const object of [pupil,glint]){
          if(!object)continue;
          const b=base(object);
          object.position.x=b.position.x+clamp(dx,-1,1)*.105;
          object.position.y=b.position.y+clamp(dy,-1,1)*.085;
          object.scale.y=b.scale.y*(1-blink*.97-squint*.18+wide*.08);
        }
        if(panel){const b=base(panel);panel.scale.y=b.scale.y*(1-blink*.70-squint*.17+wide*.12);}
        const top=part('EyeTopLid_'+side);
        if(top){const b=base(top);top.position.y=b.position.y-blink*.17-anger*.018;top.scale.y=b.scale.y*(1+blink*.12+anger*.08);}
        const bottom=part('EyeBottomLid_'+side);
        if(bottom){const b=base(bottom);bottom.position.y=b.position.y+blink*.12+anger*.008;bottom.scale.y=b.scale.y*(1+blink*.08+anger*.035);}
      }

      // Mouth controls use MediaPipe/MindAR blendshapes. Preserve the mesh topology and curve lip vertices
      // so smiling makes lifted corners instead of simply stretching a rectangle.
      const jaw=clamp(score(s,'jawOpen'));
      const smileL=clamp(score(s,'mouthSmileLeft'));
      const smileR=clamp(score(s,'mouthSmileRight'));
      const smile=(smileL+smileR)*.5;
      const frown=clamp(Math.max(mouthFrown,anger*.52));
      const pucker=clamp(score(s,'mouthPucker'));
      const funnel=clamp(score(s,'mouthFunnel'));
      const pout=clamp(Math.max(pucker*.98,funnel*.78));
      const jawForward=clamp(score(s,'jawForward'));
      const mouthClose=clamp(score(s,'mouthClose'));
      const stretch=clamp((score(s,'mouthStretchLeft')+score(s,'mouthStretchRight'))*.5);
      const upperRoll=clamp(score(s,'mouthRollUpper'));
      const lowerRoll=clamp(score(s,'mouthRollLower'));
      const lowerDown=clamp((score(s,'mouthLowerDownLeft')+score(s,'mouthLowerDownRight'))*.5);
      const upperShrug=clamp(score(s,'mouthShrugUpper'));
      const lowerShrug=clamp(score(s,'mouthShrugLower'));
      const cavity=part('Mouth_Cavity');
      if(cavity){
        const b=base(cavity);
        cavity.scale.x=b.scale.x*(1+smile*.18+stretch*.08-pout*.40-mouthClose*.20-frown*.12);
        cavity.scale.y=b.scale.y*(.12+jaw*1.08+funnel*.15)*(1-pout*.25-frown*.20);
        cavity.scale.z=b.scale.z*(1+pout*.15);
        cavity.position.y=b.position.y-jaw*.018-frown*.020;
        cavity.position.z=b.position.z+pout*.055+funnel*.035+jawForward*.035;
      }
      const upper=part('Mouth_Upper');
      if(upper){
        const b=base(upper);
        upper.scale.x=b.scale.x*(1+smile*.12+stretch*.08-pout*.38-frown*.08);
        upper.scale.y=b.scale.y*(1+pout*.34+upperRoll*.12+upperShrug*.08);
        upper.position.y=b.position.y+smile*.018-frown*.006+jaw*.020+upperShrug*.018;
        upper.position.z=b.position.z+pout*.105+funnel*.055;
        curveLip(upper,smile*.14-frown*.22,(smileR-smileL)*.030);
      }
      const lower=part('Mouth_Lower');
      if(lower){
        const b=base(lower);
        lower.scale.x=b.scale.x*(1+smile*.10+stretch*.08-pout*.42-frown*.07);
        lower.scale.y=b.scale.y*(1+pout*.42+lowerRoll*.15+lowerShrug*.08);
        lower.position.y=b.position.y-jaw*.115-lowerDown*.035+smile*.012-frown*.012-lowerShrug*.012;
        lower.position.z=b.position.z+pout*.135+funnel*.065+jawForward*.045;
        curveLip(lower,smile*.15-frown*.19,(smileR-smileL)*.027);
      }
      for(const name of ['Cheek_Left','Cheek_Right']){
        const cheek=part(name);if(!cheek)continue;
        const b=base(cheek);const puff=clamp(score(s,'cheekPuff'));
        cheek.scale.x=b.scale.x*(1+smile*.08+puff*.22-frown*.035);
        cheek.scale.y=b.scale.y*(1+smile*.10+puff*.18-frown*.06);
        cheek.position.y=b.position.y+smile*.018+puff*.012-frown*.012;
      }
    }

    function curveLip(object, smileCurve, asymmetry=0){
      if(!object?.geometry?.attributes?.position)return;
      const geometry=object.geometry;
      const attr=geometry.attributes.position;
      let original=baseVertices.get(geometry);
      if(!original){original=new Float32Array(attr.array);baseVertices.set(geometry,original);}
      // The lip meshes are centered around local X=0. Raising the corners produces a soft smile arc.
      for(let i=0;i<attr.count;i++){
        const x=original[i*3], y=original[i*3+1];
        const normalized=clamp(Math.abs(x)/.28,0,1);
        const side=Math.sign(x);
        attr.array[i*attr.itemSize+1]=y+smileCurve*normalized*normalized+asymmetry*side*normalized;
      }
      attr.needsUpdate=true;
      geometry.computeVertexNormals();
      geometry.computeBoundingSphere();
    }

    async function startTracking(){
      if(started)return;
      started=true;lastFrameTime=0;startButton.hidden=true;status('กำลังเปิดกล้องและโหลดโมเดล 3D…');
      try{
        // MindAR defaults are tuned for its One Euro pose filter; the old ultra-low cutoff made fast head turns lag behind.
        mindar=new MindARThree({container,maxTrack:1,filterMinCF:.001,filterBeta:1});
        const {renderer:arRenderer,scene,camera}=mindar;
        renderer=arRenderer;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
        renderer.setClearColor(0x000000,0);
        renderer.setClearAlpha(0);
        renderer.domElement.style.background='transparent';
        renderer.domElement.style.transform='none';
        scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1.55));
        const key=new THREE.DirectionalLight(0xffffff,1.35);key.position.set(-1,2,3);scene.add(key);
        const fill=new THREE.DirectionalLight(0xffffff,.55);fill.position.set(2,.5,1);scene.add(fill);

        status('กำลังโหลด my_face.glb…');
        const gltf=await new GLTFLoader().loadAsync('./my_face.glb');
        model=gltf.scene;
        // GLB dimensions are designed as a full face mask. Scale is intentionally larger than
        // the previous 0.42 value; the screenshot showed the old mask at roughly half-size.
        model.scale.setScalar(1.08);
        // Landmark 1 is the nose tip; use it for a full-face mask instead of the glasses-style bridge anchor.
        model.position.set(0,0,0.015);
        model.traverse(object=>{
          if(!object.isMesh)return;
          trackedMeshes.push(object);
          cacheBase(object);
          const materials=Array.isArray(object.material)?object.material:[object.material];
          for(const material of materials){if(material){material.transparent=false;material.needsUpdate=true;}}
        });
        // Use MindAR's standard landmark-1 anchor. The GLB origin is designed around the nose/central face.
        mindar.addAnchor(1).group.add(model);

        await mindar.start();
        // Do not override MindAR's own video crop/scaleX(-1): its tracking input and preview
        // are intentionally coordinated for the front camera. Only adjust stacking order.
        const video=mindar.video||container.querySelector('video');
        if(video)video.style.zIndex='0';
        renderer.domElement.style.zIndex='1';
        status('กำลังติดตามใบหน้า — ลองหันหน้า มองซ้าย/ขวา ยิ้ม หน้าบึ้ง ทำปากจู่ และยักคิ้ว');
        const animate=(now=performance.now())=>{
          raf=requestAnimationFrame(animate);
          const dt=lastFrameTime?Math.min((now-lastFrameTime)/1000,.05):1/60;
          lastFrameTime=now;
          const categories=mindar.getLatestEstimate()?.blendshapes?.categories||[];
          if(categories.length){
            const raw=Object.create(null);
            for(const item of categories)raw[item.categoryName]=item.score;
            updateFace(raw,dt);
          }
          renderer.render(scene,camera);
        };
        animate();
      }catch(err){
        console.error(err);
        status('เปิดไม่สำเร็จ: '+(err?.message||err)+' — ตรวจสอบสิทธิ์กล้องและการอัปโหลดไฟล์ my_face.glb');
        try{mindar?.stop();}catch(_){}
        startButton.hidden=false;started=false;
      }
    }
    startButton.addEventListener('click',startTracking);
    window.addEventListener('beforeunload',()=>{if(raf)cancelAnimationFrame(raf);try{mindar?.stop();}catch(_){}});
  </script>
</body>
</html>
