
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Tracking - New Hat and Glasses</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <a-scene
    mindar-face
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="30000">

      <!-- หมวกโมเดลใหม่ -->
      <a-asset-item
        id="newHat"
        src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/hat2/scene.gltf">
      </a-asset-item>

      <!-- แว่นโมเดลใหม่ -->
      <a-asset-item
        id="newGlasses"
        src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses2/scene.gltf">
      </a-asset-item>

    </a-assets>

    <!-- หมวก: คงตำแหน่งและขนาดเดิม -->
    <a-entity mindar-face-target="anchorIndex: 10">
      <a-gltf-model
        src="#newHat"
        position="0 0.65 -0.5"
        rotation="0 0 0"
        scale="0.2 0.2 0.2">
      </a-gltf-model>
    </a-entity>

    <!-- แว่น: คงตำแหน่งและขนาดเดิม -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <a-gltf-model
        src="#newGlasses"
        position="0 0 -0.1"
        rotation="0 0 0"
        scale="0.009 0.009 0.009">
      </a-gltf-model>
    </a-entity>

    <!-- ใช้กล้องของ MindAR เพื่อให้เห็นหน้าจริง -->
    <a-camera
      active="false"
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

  </a-scene>
</body>
</html>
