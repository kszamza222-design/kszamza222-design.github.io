
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mafia Face Filter</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <a-scene
    mindar-face
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets></a-assets>

    <!-- หมวกมาเฟียสีดำ -->
    <a-entity mindar-face-target="anchorIndex: 10">

      <!-- ปีกหมวก -->
      <a-cylinder
        position="0 0.12 0"
        radius="0.48"
        height="0.045"
        color="#101010"
        material="roughness: 0.8">
      </a-cylinder>

      <!-- ตัวหมวก -->
      <a-cylinder
        position="0 0.31 0.015"
        radius="0.29"
        height="0.34"
        color="#080808"
        material="roughness: 0.75">
      </a-cylinder>

      <!-- ส่วนบนหมวก -->
      <a-circle
        position="0 0.485 0.015"
        radius="0.29"
        color="#080808"
        rotation="-90 0 0">
      </a-circle>

      <!-- แถบคาดหมวก -->
      <a-cylinder
        position="0 0.19 0.015"
        radius="0.294"
        height="0.055"
        color="#4b1717"
        material="roughness: 0.5">
      </a-cylinder>

    </a-entity>

    <!-- บุหรี่คาบที่มุมปาก -->
    <a-entity mindar-face-target="anchorIndex: 13">

      <!-- ตัวบุหรี่ -->
      <a-cylinder
        position="0.16 -0.015 -0.025"
        rotation="0 0 90"
        radius="0.022"
        height="0.32"
        color="#f5f1e8"
        material="roughness: 0.65">
      </a-cylinder>

      <!-- ก้นกรองสีน้ำตาล -->
      <a-cylinder
        position="0.305 -0.015 -0.025"
        rotation="0 0 90"
        radius="0.023"
        height="0.065"
        color="#b77b42"
        material="roughness: 0.7">
      </a-cylinder>

      <!-- ปลายบุหรี่สีแดงเข้ม -->
      <a-cylinder
        position="0.015 -0.015 -0.025"
        rotation="0 0 90"
        radius="0.021"
        height="0.018"
        color="#74251d">
      </a-cylinder>

    </a-entity>

    <a-camera
      active="false"
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

  </a-scene>
</body>
</html>
