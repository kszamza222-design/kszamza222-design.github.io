
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Tracking - Mafia Filter</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <a-scene
    mindar-face
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="30000"></a-assets>

    <!-- หมวก Fedora สีดำ -->
    <a-entity
      mindar-face-target="anchorIndex: 10"
      position="0 0.65 -0.5"
      scale="0.2 0.2 0.2">

      <!-- ปีกหมวก -->
      <a-cylinder
        position="0 0 0"
        radius="0.48"
        height="0.045"
        color="#111111"
        material="roughness: 0.85">
      </a-cylinder>

      <!-- ตัวหมวก -->
      <a-cylinder
        position="0 0.22 0"
        radius="0.29"
        height="0.38"
        color="#080808"
        material="roughness: 0.8">
      </a-cylinder>

      <!-- ด้านบนหมวก -->
      <a-cylinder
        position="0 0.42 0"
        radius="0.29"
        height="0.025"
        color="#080808">
      </a-cylinder>

      <!-- แถบคาดสีแดงเข้ม -->
      <a-cylinder
        position="0 0.055 0"
        radius="0.295"
        height="0.055"
        color="#541515">
      </a-cylinder>

    </a-entity>

    <!-- แว่นกันแดดทรงเหลี่ยม -->
    <a-entity
      mindar-face-target="anchorIndex: 168"
      position="0 0 -0.1"
      scale="0.2 0.2 0.2">

      <!-- กรอบซ้าย -->
      <a-box
        position="-0.42 0 0"
        width="0.75"
        height="0.42"
        depth="0.12"
        color="#080808">
      </a-box>

      <!-- เลนส์ซ้าย -->
      <a-box
        position="-0.42 0.015 0.07"
        width="0.60"
        height="0.29"
        depth="0.025"
        color="#252a30"
        material="metalness: 0.25; roughness: 0.2">
      </a-box>

      <!-- กรอบขวา -->
      <a-box
        position="0.42 0 0"
        width="0.75"
        height="0.42"
        depth="0.12"
        color="#080808">
      </a-box>

      <!-- เลนส์ขวา -->
      <a-box
        position="0.42 0.015 0.07"
        width="0.60"
        height="0.29"
        depth="0.025"
        color="#252a30"
        material="metalness: 0.25; roughness: 0.2">
      </a-box>

      <!-- สะพานแว่น -->
      <a-box
        position="0 0.04 0.02"
        width="0.22"
        height="0.09"
        depth="0.10"
        color="#080808">
      </a-box>

    </a-entity>

    <!-- กล้องของ MindAR -->
    <a-camera
      active="false"
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

  </a-scene>
</body>
</html>
