<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Face Tracking</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR Face Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      z-index: 9999;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 12px 18px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="status">กำลังโหลดระบบ Face Tracking...</div>

<a-scene
  mindar-face="autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <!-- โหลดโมเดล -->
  <a-assets>
    <a-asset-item
      id="glassesModel"
      src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf">
    </a-asset-item>

    <a-asset-item
      id="headModel"
      src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb">
    </a-asset-item>
  </a-assets>

  <!-- โมเดลบังศีรษะ -->
  <a-entity mindar-face-target="anchorIndex: 168">
    <a-gltf-model
      mindar-face-occluder
      src="#headModel"
      position="0 -0.3 0.15"
      rotation="0 0 0"
      scale="0.065 0.065 0.065">
    </a-gltf-model>
  </a-entity>

  <!-- โมเดลแว่นตา -->
  <a-entity mindar-face-target="anchorIndex: 168">
    <a-gltf-model
      src="#glassesModel"
      position="0 0.65 -0.5"
      rotation="0 0 0"
      scale="0.2 0.2 0.2">
    </a-gltf-model>
  </a-entity>

  <!-- กล้องสำหรับ Face Tracking -->
  <a-camera
    active="false"
    position="0 0 0">
  </a-camera>

</a-scene>

<script>
  const statusBox = document.getElementById("status");
  const sceneEl = document.querySelector("a-scene");

  function setStatus(message) {
    statusBox.textContent = message;
  }

  sceneEl.addEventListener("loaded", () => {
    setStatus("ระบบโหลดแล้ว กำลังเริ่มกล้อง...");
  });

  sceneEl.addEventListener("arReady", () => {
    setStatus("กล้องพร้อมแล้ว กรุณาหันหน้าเข้าหากล้อง");
  });

  sceneEl.addEventListener("arError", (event) => {
    console.error("MindAR error:", event);
    setStatus("เริ่มกล้องไม่สำเร็จ กรุณาตรวจสอบสิทธิ์กล้อง");
  });

  sceneEl.addEventListener("targetFound", () => {
    setStatus("ตรวจพบใบหน้าแล้ว");
  });

  sceneEl.addEventListener("targetLost", () => {
    setStatus("ไม่พบใบหน้า กรุณาหันหน้าเข้าหากล้อง");
  });

  window.addEventListener("error", (event) => {
    console.error("JavaScript error:", event.message);
  });
</script>

</body>
</html>
