
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Face Tracking</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR Face Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
    }
  </style>
</head>

<body>

<a-scene
  mindar-face
  embedded
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <!-- โหลดโมเดล -->
  <a-assets>
    <a-asset-item
      id="glassesModel"
      src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf">
    </a-asset-item>

    <a-asset-item
      id="headModel"
      src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb">
    </a-asset-item>
  </a-assets>

  <!-- ระบบบังส่วนด้านหลังของโมเดล -->
  <a-entity mindar-face-target="anchorIndex: 168">
    <a-gltf-model
      mindar-face-occluder
      src="#headModel"
      position="0 -0.3 0.15"
      rotation="0 0 0"
      scale="0.065 0.065 0.065">
    </a-gltf-model>
  </a-entity>

  <!-- โมเดลแว่นตา -->
  <a-entity mindar-face-target="anchorIndex: 168">
    <a-gltf-model
      src="#glassesModel"
      position="0 0.65 -0.5"
      rotation="0 0 0"
      scale="0.2 0.2 0.2">
    </a-gltf-model>
  </a-entity>

  <!-- กล้องสำหรับ Face Tracking -->
  <a-camera
    active="false"
    position="0 0 0">
  </a-camera>

</a-scene>

</body>
</html>
