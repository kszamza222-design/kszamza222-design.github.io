<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Tracking - Hat and Glasses</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <a-scene
    mindar-face
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item
        id="headModel"
        src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb">
      </a-asset-item>

      <a-asset-item
        id="glassesModel"
        src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf">
      </a-asset-item>

      <a-asset-item
        id="hatModel"
        src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/hat/scene.gltf">
      </a-asset-item>
    </a-assets>

    <!-- ศีรษะล่องหน ใช้บังส่วนของแว่นและหมวกที่อยู่ด้านหลัง -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <a-gltf-model
        mindar-face-occluder
        src="#headModel"
        position="0 -0.3 0.15"
        rotation="0 0 0"
        scale="0.065 0.065 0.065">
      </a-gltf-model>
    </a-entity>

    <!-- หมวก: Anchor 10 อยู่บริเวณหน้าผากด้านบน -->
    <a-entity mindar-face-target="anchorIndex: 10">
      <a-gltf-model
        src="#hatModel"
        position="0 0.65 -0.5"
        rotation="0 0 0"
        scale="0.2 0.2 0.2">
      </a-gltf-model>
    </a-entity>

    <!-- แว่น: Anchor 168 อยู่กึ่งกลางระหว่างดวงตา -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <a-gltf-model
        src="#glassesModel"
        position="0 0 -0.1"
        rotation="0 0 0"
        scale="0.009 0.009 0.009">
      </a-gltf-model>
    </a-entity>

    <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>
</body>
</html>
