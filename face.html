
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Face Tracking - Hat and Glasses</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <a-scene
    mindar-face
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="30000">
    </a-assets>

    <!-- หมวก: เพิ่มขนาดจาก 0.2 เป็น 0.4 -->
    <a-entity
      mindar-face-target="anchorIndex: 10"
      position="0 0.65 -0.5"
      scale="0.4 0.4 0.4">

      <!-- ปีกหมวก -->
      <a-cylinder
        position="0 0.05 0"
        radius="0.48"
        height="0.035"
        color="#171717"
        material="roughness: 0.8">
      </a-cylinder>

      <!-- ส่วนบนของหมวก -->
      <a-cylinder
        position="0 0.19 0"
        radius="0.31"
        height="0.27"
        color="#242424"
        material="roughness: 0.8">
      </a-cylinder>

      <!-- ขอบหมวกด้านบน -->
      <a-cylinder
        position="0 0.33 0"
        radius="0.31"
        height="0.025"
        color="#111111">
      </a-cylinder>

    </a-entity>

    <!-- แว่น: ลดขนาดจาก 0.2 เหลือ 0.1 -->
    <a-entity
      mindar-face-target="anchorIndex: 168"
      position="0 0 -0.1"
      scale="0.1 0.1 0.1">

      <!-- เลนส์แว่นซ้าย -->
      <a-box
        position="-0.42 0 0"
        width="0.75"
        height="0.48"
        depth="0.07"
        color="#111111"
        material="roughness: 0.25">
      </a-box>

      <!-- เลนส์แว่นขวา -->
      <a-box
        position="0.42 0 0"
        width="0.75"
        height="0.48"
        depth="0.07"
        color="#111111"
        material="roughness: 0.25">
      </a-box>

      <!-- สะพานแว่น -->
      <a-box
        position="0 0.03 0"
        width="0.18"
        height="0.07"
        depth="0.07"
        color="#111111">
      </a-box>

      <!-- ขาแว่นซ้าย -->
      <a-box
        position="-0.81 0.02 -0.02"
        width="0.35"
        height="0.055"
        depth="0.055"
        color="#111111">
      </a-box>

      <!-- ขาแว่นขวา -->
      <a-box
        position="0.81 0.02 -0.02"
        width="0.35"
        height="0.055"
        depth="0.055"
        color="#111111">
      </a-box>

    </a-entity>

    <!-- กล้องสำหรับ Face Tracking -->
    <a-camera
      active="false"
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

  </a-scene>
</body>
</html>
